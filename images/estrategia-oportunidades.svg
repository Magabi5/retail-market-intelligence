<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#F4F6F7"/>
<rect width="1200" height="88" fill="#0E3A56"/>
<polygon points="1030,0 1200,0 1200,88 970,88" fill="#F58C3A"/>
<text x="28" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#FFFFFF">Estratégia & Oportunidades</text>
<text x="30" y="112" font-family="Arial" font-size="15" font-weight="700" fill="#2C3135">Recomendações a partir dos padrões de vendas, filiais e perfis de consumidores</text>
<text x="180" y="150" font-family="Arial" font-size="18" font-weight="700" fill="#2C3135">Portfólio</text>
<text x="855" y="150" font-family="Arial" font-size="18" font-weight="700" fill="#2C3135">Marketing & Relacionamento</text>
<rect x="35" y="175" width="635" height="120" rx="22" fill="#FFFFFF" stroke="#F58C3A"/><text x="58" y="209" font-family="Arial" font-size="15" font-weight="700" fill="#2C3135">1 - Estratégia por perfil de cliente</text><text x="195" y="209" font-family="Arial" font-size="12" fill="#555">Alto Valor concentra ~75% da receita. Tratar cada segmento com uma jornada diferente.</text><rect x="35" y="325" width="635" height="120" rx="22" fill="#FFFFFF" stroke="#F58C3A"/><text x="58" y="359" font-family="Arial" font-size="15" font-weight="700" fill="#2C3135">2 - Orientar portfólio pela demanda</text><text x="195" y="359" font-family="Arial" font-size="12" fill="#555">O Top 5 muda por perfil. Usar mix por segmento e desempenho da filial.</text><rect x="35" y="475" width="635" height="120" rx="22" fill="#FFFFFF" stroke="#F58C3A"/><text x="58" y="509" font-family="Arial" font-size="15" font-weight="700" fill="#2C3135">3 - Promoções mais direcionadas</text><text x="195" y="509" font-family="Arial" font-size="12" fill="#555">Desconto médio varia pouco. Testar incentivos por segmento e acompanhar resultado.</text>
<polygon points="720,180 865,180 900,220 865,260 720,260" fill="#0E3A56"/><text x="735" y="206" font-family="Arial" font-size="15" font-weight="700" fill="#FFF">ALTO VALOR</text><text x="735" y="234" font-family="Arial" font-size="14" fill="#FFF">Reter e proteger</text><text x="920" y="214" font-family="Arial" font-size="12" fill="#555">40,3% da base | ~75% da receita</text><polygon points="720,280 865,280 900,320 865,360 720,360" fill="#F58C3A"/><text x="735" y="306" font-family="Arial" font-size="15" font-weight="700" fill="#FFF">OCASIONAL</text><text x="735" y="334" font-family="Arial" font-size="14" fill="#FFF">Estimular 2ª compra</text><text x="920" y="314" font-family="Arial" font-size="12" fill="#555">37,9% da base | 1,41 compra/cliente</text><polygon points="720,380 865,380 900,420 865,460 720,460" fill="#0E3A56"/><text x="735" y="406" font-family="Arial" font-size="15" font-weight="700" fill="#FFF">RECORRENTE</text><text x="735" y="434" font-family="Arial" font-size="14" fill="#FFF">Aumentar cesta média</text><text x="920" y="414" font-family="Arial" font-size="12" fill="#555">3,36 compras/cliente | ticket R$ 218,52</text><polygon points="720,480 865,480 900,520 865,560 720,560" fill="#F58C3A"/><text x="735" y="506" font-family="Arial" font-size="15" font-weight="700" fill="#FFF">ALTO TICKET</text><text x="735" y="534" font-family="Arial" font-size="14" fill="#FFF">Estimular recompra</text><text x="920" y="514" font-family="Arial" font-size="12" fill="#555">Ticket R$ 890,21 | 1,79 compra/cliente</text>
<rect x="710" y="585" width="455" height="55" fill="#0E3A56"/>
<text x="725" y="608" font-family="Arial" font-size="12" font-weight="700" fill="#FFF">Promoções: descontos semelhantes entre segmentos (~2,3%–2,4%).</text>
<text x="725" y="628" font-family="Arial" font-size="12" fill="#FFF">Recomendação: testar promoções direcionadas e acompanhar o resultado.</text>
</svg>